services:
  - type: web
    name: facilita-ai
    runtime: python
    buildCommand: |
      pip install -r requirements.txt
      python -c "from app import app, db; app.app_context().push(); db.create_all()"
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: facilita-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true